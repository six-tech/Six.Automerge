[package]
name = "six_automerge"
version = "0.1.0"
edition = "2021"
description = "FFI for Automerge exposed to C# via Interoptopus"
license = "MIT"
publish = false

[lib]
name = "six_automerge"
crate-type = ["cdylib", "rlib"]

[dependencies]
automerge = "0.7.3"
interoptopus = "0.15.0-alpha.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
