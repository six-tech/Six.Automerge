# Cross-compilation linker configuration for six_automerge native library.
# These settings are used when building for non-host platforms via:
#   dotnet scripts/build-native.cs -- --target-os linux --target-arch arm64

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"
